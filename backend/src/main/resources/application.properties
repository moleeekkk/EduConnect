spring.application.name=EduConnect

# Master Baseline Seeding Control (Disabled by default)
app.seed.enabled=${APP_SEED_ENABLED:false}

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/educonnect_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:EC@123}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Spring Mail Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:maulik.svgu.16@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:avjkwftebcnfeyio}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_TRUST:smtp.gmail.com}

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Payload & Tomcat Server Configuration
server.port=8080
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-swallow-size=10MB
server.tomcat.max-http-form-post-size=10MB

# Local File Upload Directory Configuration
app.upload.directory=uploads

# JWT Security Configuration
jwt.secret=${JWT_SECRET:EduConnectSuperSecureJwtSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm2026}
jwt.expiration=86400000